name: Build and deploy industry dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-and-deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate or verify project dataset
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('sample_tn_investment_mou_tracker.csv')
          if not p.exists():
              d=['Ariyalur','Chengalpattu','Chennai','Coimbatore','Cuddalore','Dharmapuri','Dindigul','Erode','Kancheepuram','Karur','Madurai','Salem','Thanjavur','Tiruppur','Tiruvallur','Vellore','Virudhunagar','Tirunelveli']; sec=['Electronics','Automotive','Renewables','Textiles','Logistics','IT/ITES','Food Processing','Pharma']; h=['mou_id','sector','district','announced_investment_inr','realisation_pct','realised_investment_inr','jobs_promised','jobs_verified','days_to_realisation']
              with p.open('w',newline='',encoding='utf-8') as f:
                  w=csv.writer(f); w.writerow(h)
                  for i in range(1,98):
                      ann=50000000+(i*7919)%950000000; real=18+(i*11)%79; jobs=100+(i*137)%4900; ver=round(jobs*(.28+((i*7)%63)/100)); w.writerow([f'MOU-{i:04d}',sec[(i-1)%8],d[(i*3)%len(d)],ann,real,round(ann*real/100),jobs,ver,120+(i*47)%880])
          PY
      - name: Build dashboard bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/index.html -o dashboard/index.html
          curl -fsSL https://raw.githubusercontent.com/sanjay-arlo/chennai-water-security-tanker-allocation/main/dashboard/app.js -o dashboard/app.js
          cp sample_tn_investment_mou_tracker.csv dashboard/data.csv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard sample_tn_investment_mou_tracker.csv
          if ! git diff --cached --quiet; then git commit -m 'feat: build industry dashboard and dataset [skip ci]'; git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dashboard}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
